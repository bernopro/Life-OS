<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Life OS</title>
  <meta name="description" content="Your personal life dashboard: calendar, tasks, habits, gym, nutrition, sleep, money, journal, notes, goals and focus.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 17.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=6">
  <script>
    // Apply saved theme before first paint so there is no flash.
    try {
      // use the signed-in account's theme (or the last data from before accounts existed)
      var ses = JSON.parse(sessionStorage.getItem('lifeos.session') || localStorage.getItem('lifeos.session') || 'null');
      var last = localStorage.getItem('lifeos.lastUser'); // cloud-sync accounts
      var key = ses && ses.userId ? 'lifeos.data.u.' + ses.userId : last ? 'lifeos.data.u.' + last : 'lifeos.data.v1';
      var s = (JSON.parse(localStorage.getItem(key) || '{}').settings) || {};
      var t = s.theme || 'system';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="backdrop" data-act="closeNav"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <datalist id="exlist"></datalist>
  <datalist id="foodlist"></datalist>

  <script src="js/firebase-config.js?v=6"></script>
  <script src="js/core.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/cloud.js?v=6"></script>
  <script src="js/calendar.js?v=6"></script>
  <script src="js/tasks.js?v=6"></script>
  <script src="js/habits.js?v=6"></script>
  <script src="js/fitness.js?v=6"></script>
  <script src="js/health.js?v=6"></script>
  <script src="js/finance.js?v=6"></script>
  <script src="js/finance-view.js?v=6"></script>
  <script src="js/study.js?v=6"></script>
  <script src="js/journal.js?v=6"></script>
  <script src="js/notes.js?v=6"></script>
  <script src="js/goals.js?v=6"></script>
  <script src="js/focus.js?v=6"></script>
  <script src="js/dashboard.js?v=6"></script>
  <script src="js/settings.js?v=6"></script>
  <script src="js/sample.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
